name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image (sanity check only, not pushed)
        run: docker build -t esp32-tilt-backend:ci .

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Render
        run: curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy frontend to Render
        run: curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

      - name: Poll backend until healthy
        run: |
          timeout 300 bash -c '
            until curl -sf https://esp32-tilt-backend.onrender.com/health; do
              echo "Backend not ready yet, retrying in 5s..."
              sleep 5
            done
          ' || (echo "Backend did not become healthy within 5 minutes" && exit 1)

      - name: Poll frontend until reachable
        run: |
          timeout 180 bash -c '
            until curl -sf -o /dev/null https://esp32-tilt-frontend.onrender.com/; do
              echo "Frontend not ready yet, retrying in 5s..."
              sleep 5
            done
          ' || (echo "Frontend did not become reachable within 3 minutes" && exit 1)
