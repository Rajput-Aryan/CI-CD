# ------------------------------------------------------------------
# Main stack using Public MQTT Broker (broker.emqx.io):
#   postgres  -> stores the device whitelist + live status/data
#   backend   -> Express API + MQTT subscriber (with whitelist verification)
#   frontend  -> React app (Upload page + Dashboard page)
# ------------------------------------------------------------------
services:

  postgres:
    image: postgres:16-alpine
    container_name: mqtt_device_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devicedb
      POSTGRES_USER: deviceuser
      POSTGRES_PASSWORD: devicepass
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mqtt_device_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgres://deviceuser:devicepass@postgres:5432/devicedb
      MQTT_BROKER_URL: mqtt://broker.emqx.io:1883
      HEARTBEAT_TIMEOUT_SECONDS: 30
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: mqtt_device_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  pg_data:
