node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

# ---- AUTHENTICATION (runs on CONNECT) ----
# Sandbox devices connect using their MAC address as both the
# MQTT client id AND username. Backend checks that MAC against
# the whitelist table before allowing the connection.
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://backend:4000/mqtt/auth"
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    headers { "content-type" = "application/json" }
  }
]

# ---- AUTHORIZATION (runs on every PUBLISH / SUBSCRIBE) ----
# Even a device that DID connect can only publish to ITS OWN topic
# (devices/<its-own-mac>/...). This stops one device from spoofing
# another device's data.
authorization {
  sources = [
    {
      type = http
      method = post
      url = "http://backend:4000/mqtt/acl"
      body {
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      headers { "content-type" = "application/json" }
    }
  ]
  no_match = deny
}
