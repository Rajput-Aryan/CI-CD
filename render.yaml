databases:
  - name: esp32-tilt-db
    plan: free
    databaseName: devicedb
    user: deviceuser

services:
  - type: web
    name: esp32-tilt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PORT
        value: 4000
      - key: MQTT_BROKER_URL
        value: mqtt://broker.emqx.io:1883
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: 30
      - key: DATABASE_URL
        fromDatabase:
          name: esp32-tilt-db
          property: connectionString

  - type: web
    name: esp32-tilt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://esp32-tilt-backend.onrender.com
